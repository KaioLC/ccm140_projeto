syntax = "proto3";

package chat;

message Request {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 7;

  oneof payload {
    LoginRequest login = 3;
    ChannelRequest channel = 4;
    ChannelListRequest list = 5;
    PublishRequest publish = 6;
  }
}

message Response {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 7;

  oneof payload {
    LoginResponse login = 3;
    ChannelResponse channel = 4;
    ChannelListResponse list = 5;
    PublishResponse publish = 6;
  }
}

message LoginRequest {
  string id = 1;
  string user = 2;
}

message LoginResponse {
  string id = 1;
  bool status = 2;
  string message = 3;
}

message ChannelRequest {
  string id = 1;
  string name = 2;
}

message ChannelResponse {
  string id = 1;
  string name = 2;
  bool status = 3;
  string message = 4;
}

message ChannelListRequest {}

message ChannelListResponse {
  repeated string channels = 1;
}

message PublishRequest {
  string id = 1;
  string user = 2;
  string channel = 3;
  string content = 4;
}

message PublishResponse {
  string id = 1;
  bool status = 2;
  string message = 3;
}

message Publication {
  string id = 1;
  string user = 2;
  string channel = 3;
  string content = 4;
  int64 timestamp = 5;
  int64 clock = 6;
}

// ==========================================
// Mensagens de Referência e Heartbeat (Parte 3)
// ==========================================

message ServerInfo {
  string name = 1;
  int32 rank = 2;
}

message RegisterRequest {
  string name = 1;
}

message RegisterResponse {
  string name = 1;
  int32 rank = 2;
}

message ServerListRequest {}

message ServerListResponse {
  repeated ServerInfo servers = 1;
}

message HeartbeatRequest {
  string name = 1;
}

message HeartbeatResponse {
  bool status = 1;
  int64 physical_time = 2;
}

message ReferenceRequest {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 3;

  oneof payload {
    RegisterRequest reg = 4;
    ServerListRequest list = 5;
    HeartbeatRequest heartbeat = 6;
  }
}

message ReferenceResponse {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 3;

  oneof payload {
    RegisterResponse reg = 4;
    ServerListResponse list = 5;
    HeartbeatResponse heartbeat = 6;
  }
}
