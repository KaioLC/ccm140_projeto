syntax = "proto3";

package chat;

message Request {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 7;

  oneof payload {
    LoginRequest login = 3;
    ChannelRequest channel = 4;
    ChannelListRequest list = 5;
    PublishRequest publish = 6;
  }
}

message Response {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 7;

  oneof payload {
    LoginResponse login = 3;
    ChannelResponse channel = 4;
    ChannelListResponse list = 5;
    PublishResponse publish = 6;
  }
}

message LoginRequest {
  string id = 1;
  string user = 2;
}

message LoginResponse {
  string id = 1;
  bool status = 2;
  string message = 3;
}

message ChannelRequest {
  string id = 1;
  string name = 2;
}

message ChannelResponse {
  string id = 1;
  string name = 2;
  bool status = 3;
  string message = 4;
}

message ChannelListRequest {}

message ChannelListResponse {
  repeated string channels = 1;
}

message PublishRequest {
  string id = 1;
  string user = 2;
  string channel = 3;
  string content = 4;
}

message PublishResponse {
  string id = 1;
  bool status = 2;
  string message = 3;
}

message Publication {
  string id = 1;
  string user = 2;
  string channel = 3;
  string content = 4;
  int64 timestamp = 5;
  int64 clock = 6;
}

message ServerInfo {
  string name = 1;
  int32 rank = 2;
  string endpoint = 3;
}

message RegisterRequest {
  string name = 1;
  string endpoint = 2;
}

message RegisterResponse {
  string name = 1;
  int32 rank = 2;
}

message ServerListRequest {}

message ServerListResponse {
  repeated ServerInfo servers = 1;
}

message HeartbeatRequest {
  string name = 1;
}

message HeartbeatResponse {
  bool status = 1;
  int64 physical_time = 2;
}

message ReferenceRequest {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 3;

  oneof payload {
    RegisterRequest reg = 4;
    ServerListRequest list = 5;
    HeartbeatRequest heartbeat = 6;
  }
}

message ReferenceResponse {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 3;

  oneof payload {
    RegisterResponse reg = 4;
    ServerListResponse list = 5;
    HeartbeatResponse heartbeat = 6;
  }
}

message ClockSyncRequest {
  string server = 1;
  int64 target_time = 2;
}

message ClockSyncResponse {
  string server = 1;
  int64 physical_time = 2;
}

message ElectionRequest {
  string server = 1;
  int32 rank = 2;
}

message ElectionResponse {
  string server = 1;
  bool status = 2;
}

message CoordinatorAnnouncement {
  string coordinator = 1;
  int32 rank = 2;
  int64 timestamp = 3;
  int64 clock = 4;
}

message ServerMessage {
  string id = 1;
  int64 timestamp = 2;
  int64 clock = 3;

  oneof payload {
    ClockSyncRequest clock_sync = 4;
    ClockSyncResponse clock_res = 5;
    ElectionRequest election = 6;
    ElectionResponse election_res = 7;
    ReplicationSyncRequest replication_sync = 8;
    ReplicationSyncResponse replication_snapshot = 9;
  }
}

message ReplicationSyncRequest {}

message ReplicationSyncResponse {
  repeated ReplicationEvent events = 1;
}

enum ReplicationType {
  REP_LOGIN = 0;
  REP_CHANNEL = 1;
  REP_MESSAGE = 2;
}

message ReplicationEvent {
  string sender = 1;
  ReplicationType type = 2;
  string id = 3;
  int64 timestamp = 4;
  int64 clock = 5;
  string user = 6;
  string name = 7;
  string channel = 8;
  string content = 9;
}
