services:
  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    image: ccm140:broker
    container_name: broker
    volumes:
      - ./broker/broker.py:/app/main.py
    ports:
      - "5555:5555"
      - "5556:5556"

  proxy:
    build:
      context: ./broker
      dockerfile: Dockerfile
    image: ccm140:proxy
    container_name: proxy
    volumes:
      - ./broker/proxy.py:/app/main.py
    ports:
      - "5557:5557"
      - "5558:5558"

  reference:
    build:
      context: .
      dockerfile: reference/Dockerfile
    image: ccm140:reference
    container_name: reference
    volumes:
      - ./reference/reference.py:/app/main.py
    ports:
      - "5559:5559"

  interface:
    build:
      context: .
      dockerfile: interface/Dockerfile
    image: ccm140:interface
    container_name: interface
    ports:
      - "8080:8080"
    depends_on:
      - proxy
      - reference
    deploy:
      replicas: 0

  cpp_server:
    build:
      context: .
      dockerfile: cpp_server_client/Dockerfile
    image: ccm140:cpp
    command: ["/app/server"]
    volumes:
      - ./data/cpp:/data
    depends_on:
      - broker
      - proxy
      - reference
    deploy:
      replicas: 2

  cpp_client:
    build:
      context: .
      dockerfile: cpp_server_client/Dockerfile
    image: ccm140:cpp
    command: ["/app/client"]
    depends_on:
      - cpp_server
      - proxy
    deploy:
      replicas: 2

  python_server:
    build:
      context: .
      dockerfile: python_server_client/Dockerfile
    image: ccm140:python
    command: ["/app/server"]
    volumes:
      - ./data/python:/data
    depends_on:
      - broker
      - proxy
      - reference
    deploy:
      replicas: 2

  python_client:
    build:
      context: .
      dockerfile: python_server_client/Dockerfile
    image: ccm140:python
    command: ["/app/client"]
    depends_on:
      - python_server
      - proxy
    deploy:
      replicas: 2

  java_server:
    build:
      context: .
      dockerfile: java_server_client/Dockerfile
    image: ccm140:java
    command: ["/app/server"]
    volumes:
      - ./data/java:/data
    depends_on:
      - broker
      - proxy
      - reference
    deploy:
      replicas: 2

  java_client:
    build:
      context: .
      dockerfile: java_server_client/Dockerfile
    image: ccm140:java
    command: ["/app/client"]
    depends_on:
      - java_server
      - proxy
    deploy:
      replicas: 2
