services:
  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    image: ccm140:broker
    container_name: broker
    volumes:
      - ./broker/broker.py:/app/main.py
    ports:
      - "5555:5555"
      - "5556:5556"

  proxy:
    build:
      context: ./broker
      dockerfile: Dockerfile
    image: ccm140:proxy
    container_name: proxy
    volumes:
      - ./broker/proxy.py:/app/main.py
    ports:
      - "5557:5557"
      - "5558:5558"

  reference:
    build:
      context: .
      dockerfile: reference/Dockerfile
    image: ccm140:reference
    container_name: reference
    volumes:
      - ./reference/reference.py:/app/main.py
    ports:
      - "5559:5559"

  cpp_server:
    build:
      context: .
      dockerfile: cpp_server_client/Dockerfile
    image: ccm140:cpp
    command: ["/app/server"]
    volumes:
      - ./data/cpp:/data
    depends_on:
      - broker
      - proxy
      - reference
    deploy:
      replicas: 2

  cpp_client:
    build:
      context: .
      dockerfile: cpp_server_client/Dockerfile
    image: ccm140:cpp
    command: ["/app/client"]
    depends_on:
      - cpp_server
      - proxy
    deploy:
      replicas: 2

  java_server:
    build:
      context: .
      dockerfile: java_server_client/Dockerfile
    image: ccm140:java
    command: ["chat.Servidor"]
    environment:
      BROKER_ENDPOINT: tcp://broker:5556
      PROXY_ENDPOINT: tcp://proxy:5557
      REFERENCE_ENDPOINT: tcp://reference:5559
      DB_DIR: /data
      SERVER_PEER_PORT: "6000"
    volumes:
      - ./data/java:/data
    expose:
      - "6000"
    depends_on:
      - broker
      - proxy
      - reference
    deploy:
      replicas: 2

  java_client:
    build:
      context: .
      dockerfile: java_server_client/Dockerfile
    image: ccm140:java
    command: ["chat.ClienteBot"]
    environment:
      BROKER_ENDPOINT: tcp://broker:5555
      PROXY_ENDPOINT: tcp://proxy:5558
    depends_on:
      - broker
      - proxy
      - java_server
    deploy:
      replicas: 2
