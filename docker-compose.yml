services:
  broker:
    build:
      context: ./broker
      dockerfile: Dockerfile
    image: ccm140:broker
    container_name: broker
    volumes:
      - ./broker/broker.py:/app/main.py
    ports:
      - "5555:5555"
      - "5556:5556"

  proxy:
    build:
      context: ./broker
      dockerfile: Dockerfile
    image: ccm140:proxy
    container_name: proxy
    volumes:
      - ./broker/proxy.py:/app/main.py
    ports:
      - "5557:5557"
      - "5558:5558"

  cpp_server:
    build:
      context: .
      dockerfile: cpp_server_client/Dockerfile
    image: ccm140:cpp
    command: ["/app/server"]
    volumes:
      - ./data/cpp:/data
    depends_on:
      - broker
      - proxy
    deploy:
      replicas: 2

  cpp_client:
    build:
      context: .
      dockerfile: cpp_server_client/Dockerfile
    image: ccm140:cpp
    command: ["/app/client"]
    depends_on:
      - cpp_server
      - proxy
    deploy:
      replicas: 2
